name: aerosim-milvus

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.23
    container_name: aerosim-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/var/lib/milvus/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://aerosim-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://localhost:2380
      - --initial-cluster=default=http://localhost:2380
      - --quota-backend-bytes=4294967296
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - milvus

  milvus:
    image: milvusdb/milvus:v2.6.7
    container_name: milvus-standalone
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: aerosim-etcd:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
      - ./user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - milvus

volumes:
  milvus_data:
    external: true
    name: milvus_data

networks:
  milvus:
    external: true
    name: aerosim-milvus-network
